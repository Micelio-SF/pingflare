name = "pingflare"
main = "dist/_worker.js"
compatibility_date = "2025-11-17"
compatibility_flags = ["nodejs_compat"]

# Workers Static Assets
[assets]
directory = "dist"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "pingflare-db"
database_id = "aae83e5f-a3a7-4b2c-9f2a-051c5db95dfd"
migrations_dir = "migrations"

# Daily maintenance only. Minute checks run in wrangler.checks.toml.
[triggers]
crons = ["0 0 * * *"]

# Environment variables
[vars]
ENVIRONMENT = "production"

# Manual HTTP check secret (set via `wrangler secret put`):
# - CRON_SECRET: Random string to authenticate GET /api/cron
#   Generate with: openssl rand -hex 32

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
