# Temporary config used during SvelteKit build phase
# This tells adapter-cloudflare where to output files
name = "pingflare"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = ".svelte-kit/cloudflare"

[[d1_databases]]
binding = "DB"
database_name = "pingflare-db"
database_id = "aae83e5f-a3a7-4b2c-9f2a-051c5db95dfd"

[vars]
ENVIRONMENT = "production"

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
